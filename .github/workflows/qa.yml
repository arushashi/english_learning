name: QA - Content & E2E Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC

jobs:
  content-check:
    name: Content Integrity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Run content checker
        run: node scripts/check-content.js
      
      - name: Upload content report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: content-report
          path: content-report.json
      
      - name: Comment PR with content report
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('content-report.json', 'utf8'));
            
            const comment = `## 📊 Content Integrity Report
            
            **Total Lessons:** ${report.totalLessons}
            **Errors:** ${report.totalErrors}
            **Warnings:** ${report.totalWarnings}
            
            ### Errors by Category
            ${Object.entries(report.errorsByCategory).map(([cat, count]) => `- ${cat}: ${count}`).join('\n')}
            
            ### Warnings by Category
            ${Object.entries(report.warningsByCategory).map(([cat, count]) => `- ${cat}: ${count}`).join('\n')}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Fail if errors found
        if: failure()
        run: exit 1

  e2e-tests:
    name: E2E Tests - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ['chromium', 'Mobile Chrome']
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci && npx playwright install --with-deps
      
      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }}
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
      
      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: test-videos-${{ matrix.project }}
          path: test-results/

  accessibility-scan:
    name: Accessibility Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci && npx playwright install --with-deps
      
      - name: Run accessibility tests
        run: npx playwright test e2e/accessibility.spec.ts
      
      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: accessibility-report
          path: accessibility-report.json

  lighthouse:
    name: Lighthouse Performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v9
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  summary:
    name: QA Summary
    runs-on: ubuntu-latest
    needs: [content-check, e2e-tests]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
      
      - name: Generate QA summary
        run: |
          echo "## ✅ QA Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Content Check: ${{ needs.content-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Tests: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
